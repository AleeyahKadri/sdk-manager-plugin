buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
  }
  
  dependencies {
    classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22'
  }
}

apply plugin: 'kotlin'
apply plugin: 'maven-publish'
apply plugin: 'idea'

// Set Kotlin compiler options
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '17'
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}


sourceSets {
  acceptanceTest { sourceSet ->
    sourceSet.java.srcDir file('src/acceptanceTest/java')
    sourceSet.kotlin.srcDir file('src/acceptanceTest/kotlin')
  }
}

idea {
  module {
    testSourceDirs += file('src/acceptanceTest/java')
    testSourceDirs += file('src/acceptanceTest/kotlin')
  }
}

task acceptanceTest(type: Test) {
  testClassesDirs = sourceSets.acceptanceTest.output.classesDirs
  classpath = sourceSets.acceptanceTest.runtimeClasspath
}

acceptanceTest.mustRunAfter project.tasks.findByName('test')
acceptanceTest.description = 'Runs the acceptance tests.'
acceptanceTest.group = JavaBasePlugin.VERIFICATION_GROUP

check.dependsOn acceptanceTest

repositories {
  mavenCentral()
}

dependencies {
  implementation gradleApi()
  implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
  implementation 'com.android.tools.build:gradle:1.5.0'
  implementation 'com.android.tools:common:25.1.0'
  implementation 'org.rauschig:jarchivelib:0.6.0'
  implementation 'commons-io:commons-io:2.4'

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.easytesting:fest-assert-core:2.0M10'

  acceptanceTestImplementation sourceSets.main.output
  acceptanceTestImplementation sourceSets.test.output
  acceptanceTestImplementation configurations.testImplementation
  acceptanceTestRuntimeOnly configurations.testRuntimeOnly
}

group = 'com.jakewharton.sdkmanager'
version = '1.5.0-SNAPSHOT'

publishing {
  publications {
    maven(MavenPublication) {
      artifactId = 'gradle-plugin'
      from components.java
      
      pom {
        name = 'SDK Manager'
        description = 'Gradle plugin which downloads and manages your Android SDK.'
        url = 'https://github.com/JakeWharton/sdk-manager-plugin'
        inceptionYear = '2014'
        
        scm {
          url = 'https://github.com/JakeWharton/sdk-manager-plugin'
          connection = 'scm:git:git://github.com/JakeWharton/sdk-manager-plugin.git'
          developerConnection = 'scm:git:ssh://git@github.com/JakeWharton/sdk-manager-plugin.git'
        }
        
        licenses {
          license {
            name = 'The Apache Software License, Version 2.0'
            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
            distribution = 'repo'
          }
        }
        
        developers {
          developer {
            id = 'jakewharton'
            name = 'Jake Wharton'
            email = 'jakewharton@gmail.com'
          }
        }
      }
    }
  }
}

